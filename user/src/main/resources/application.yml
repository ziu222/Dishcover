server:
  port: 8081

spring:
  application:
    name: user
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:larder}?currentSchema=user_service
    username: ${POSTGRES_USER:larder_app}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: user_service
  flyway:
    schemas: user_service
    default-schema: user_service
    # DB đã có bảng từ init-schemas.sql cũ (trước khi dùng Flyway) — baseline để Flyway coi
    # V1__init.sql là đã áp dụng, không cố CREATE TABLE lại (sẽ lỗi "already exists").
    # Môi trường hoàn toàn mới (volume rỗng): baseline không có gì để đánh dấu, Flyway chạy V1 bình thường.
    baseline-on-migrate: true
    baseline-version: "1"

# JWT: secret KHÔNG có default (bí mật, phải set env). Tối thiểu 32 ký tự cho HS256.
# Gateway sẽ dùng CÙNG secret này để verify token ở tầng gating (mục 8) — chia sẻ qua env/Config Server.
jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}

# Turnstile CÓ default (khác JWT_SECRET) — cố ý dùng secret key test chính thức của Cloudflare
# (luôn verify pass, https://developers.cloudflare.com/turnstile/troubleshooting/testing/), để
# dev/test chạy được ngay không cần tài khoản Cloudflare thật. Quên set env thật ở prod thì
# TurnstileClient vẫn "verify pass" mọi lúc — suy biến về "không có CAPTCHA", không phải lỗi crash.
turnstile:
  secret-key: ${TURNSTILE_SECRET_KEY:1x0000000000000000000000000000000AA}

resilience4j:
  circuitbreaker:
    instances:
      turnstile:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s

internal:
  service-secret: ${INTERNAL_SERVICE_SECRET}
