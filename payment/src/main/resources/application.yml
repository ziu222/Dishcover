server:
  port: 8087

spring:
  application:
    name: payment
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:larder}?currentSchema=payment_service
    username: ${POSTGRES_USER:larder_app}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: payment_service
  flyway:
    schemas: payment_service
    default-schema: payment_service
    baseline-on-migrate: true
    baseline-version: "1"
