server:
  port: 8087

spring:
  application:
    name: payment
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:larder}?currentSchema=payment_service
    username: ${POSTGRES_USER:larder_app}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: payment_service
  flyway:
    schemas: payment_service
    default-schema: payment_service
    baseline-on-migrate: true
    baseline-version: "1"

# VNPay sandbox (CLAUDE.md mục 8). hash-secret là SECRET THẬT — khác MoMo sandbox vốn dùng chung
# bộ credential công khai — nên chỉ được nạp qua biến môi trường, KHÔNG bao giờ ghi giá trị thật
# vào file này (mục 13). Lấy tmn-code/hash-secret trong mail VNPay gửi sau khi đăng ký merchant test.
vnpay:
  tmn-code: ${VNPAY_TMN_CODE:changeme}
  hash-secret: ${VNPAY_HASH_SECRET:changeme}
  pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  # Nơi TRÌNH DUYỆT quay về sau khi thanh toán. KHÔNG dùng để kích hoạt gói (mục 11) — chỉ để
  # hiển thị; client vẫn phải poll GET /payments/transactions/{orderId} mới biết kết quả thật.
  return-url: ${VNPAY_RETURN_URL:http://localhost:5173/payment/result}
  # IPN URL (server-to-server) KHÔNG khai báo ở đây: VNPay không nhận qua tham số request mà lấy
  # theo địa chỉ merchant đã đăng ký bên phía họ. Chạy local phải mở tunnel (ngrok) mới nhận được.
  version: "2.1.0"
  command: pay
  currency: VND
  locale: vn
  # Quá hạn này VNPay tự từ chối giao dịch; job quét PENDING phía mình dùng cùng mốc (mục 8).
  expire-minutes: 15

# JWT: CÙNG secret với User/Inventory/Recipe/Matching/RAG qua env JWT_SECRET.
jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
