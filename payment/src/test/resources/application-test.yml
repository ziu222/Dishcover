# H2 in-memory ở chế độ PostgreSQL, tự tạo schema payment_service; Hibernate dựng bảng (create-drop).
# Flyway tắt: migration V1 dùng cú pháp Postgres thật (UUID DEFAULT gen_random_uuid, TIMESTAMPTZ)
# không chạy trên H2 — lược đồ để Hibernate sinh từ entity, còn migration được kiểm khi chạy thật.
spring:
  datasource:
    url: jdbc:h2:mem:paymenttest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE,TYPE;INIT=CREATE SCHEMA IF NOT EXISTS payment_service
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: payment_service
  flyway:
    enabled: false

jwt:
  secret: test-secret-at-least-32-chars-long-000
  expiration-minutes: 120

vnpay:
  tmn-code: TESTTMN1
  hash-secret: test-hash-secret-khong-phai-that-000000
  return-url: http://localhost:5173/payment/result
