spring:
  datasource:
    url: jdbc:h2:mem:notificationtest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE,TYPE;INIT=CREATE SCHEMA IF NOT EXISTS notification_service
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: notification_service
  flyway:
    enabled: false
  kafka:
    listener:
      auto-startup: false
  # KHÔNG exclude MailSenderAutoConfiguration — EmailSender cần bean JavaMailSender để tạo được
  # (bản thân bean không kết nối SMTP gì lúc khởi tạo, chỉ khi gọi .send() mới thật sự nối mạng,
  # giống lý do KafkaTemplate không cần exclude ở Inventory — xem inventory/src/test/resources/application-test.yml).
  mail:
    username: test@test.com
    password: test-password

jwt:
  secret: test-secret-at-least-32-chars-long-000
  expiration-minutes: 120

internal:
  service-secret: test-internal-secret

services:
  user-url: http://localhost:0

app:
  frontend-url: http://localhost:5175
