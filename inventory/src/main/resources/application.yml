server:
  port: 8082

spring:
  application:
    name: inventory
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:larder}?currentSchema=inventory_service
    username: ${POSTGRES_USER:larder_app}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: inventory_service
  flyway:
    schemas: inventory_service
    default-schema: inventory_service
    baseline-on-migrate: true
    baseline-version: "1"
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

notification:
  scan-cron: ${NOTIFICATION_SCAN_CRON:0 0 7 * * *}

# JWT: CÙNG secret với User Service (chưa có Gateway centralize xác thực — mục 8 chưa làm),
# mỗi service tự verify token bằng chung 1 secret qua env JWT_SECRET.
jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
