server:
  port: 8085

spring:
  application:
    name: rag
  # Gemini qua endpoint tương thích OpenAI (specs/rag-service.md mục 3.5) — chỉ cần GEMINI_API_KEY,
  # không cần GCP project/IAM. spring.ai.model.chat=openai BẮT BUỘC (Spring AI 1.1.x, artifact
  # spring-ai-starter-model-openai — thuộc tính spring.ai.openai.chat.enabled cũ đã bị bỏ, thiếu
  # dòng này auto-config ChatModel không kích hoạt). Spring AI 2.0.x yêu cầu Spring Boot 4.x, KHÔNG
  # dùng được với Boot 3.5.3 của dự án (đã verify thật, gây lỗi bean conflict lúc khởi động).
  ai:
    model:
      chat: openai
    openai:
      api-key: ${GEMINI_API_KEY:changeme}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      chat:
        options:
          model: gemini-flash-latest

# Chọn LlmProvider (mặc định "gemini" nếu bỏ trống — GeminiProvider/GroqProvider, CLAUDE.md mục
# 10.7 "Vướng mắc còn tồn đọng"). groq.api-key chỉ bắt buộc khi llm.provider=groq.
llm:
  provider: ${LLM_PROVIDER:gemini}
groq:
  api-key: ${GROQ_API_KEY:changeme}
  # KHÔNG thêm /v1 — OpenAiApi tự nối /v1/chat/completions (xem Javadoc GroqProvider).
  base-url: https://api.groq.com/openai
  model: llama-3.3-70b-versatile
openai:
  api-key: ${OPENAI_API_KEY:changeme}
  # base-url để mặc định của thư viện; cũng KHÔNG thêm /v1 vì cùng lý do trên.
  base-url: https://api.openai.com
  # Dòng mini nằm trong diện token miễn phí hằng ngày nếu bật chia sẻ dữ liệu, và nhận cả ảnh
  # (dùng lại được cho Image Recognition ở mục 7).
  model: gpt-4o-mini

# Địa chỉ 2 service gọi ra (không Eureka — Docker DNS/localhost, cùng quy ước với Gateway).
services:
  matching-url: ${MATCHING_SERVICE_URL:http://localhost:8084}
  user-url: ${USER_SERVICE_URL:http://localhost:8081}
  recipe-url: ${RECIPE_SERVICE_URL:http://localhost:8083}

# JWT: CÙNG secret với User/Inventory/Recipe/Matching qua env JWT_SECRET.
jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}

# Circuit breaker cho client gọi Matching/User + LLM (specs/rag-service.md mục 5).
resilience4j:
  circuitbreaker:
    instances:
      matching-service:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
      user-service:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
      recipe-service:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
      llm:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
  timelimiter:
    instances:
      llm:
        timeoutDuration: 15s
