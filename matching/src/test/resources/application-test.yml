# Không có entity nào ở stage này (mục 6 thuần tính toán, bảng recipe_embeddings thuộc RAG - mục 7)
# nhưng spring-boot-starter-data-jpa vẫn cần 1 DataSource hợp lệ để khởi tạo context -> H2 in-memory.
spring:
  datasource:
    url: jdbc:h2:mem:matchingtest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE,TYPE;INIT=CREATE SCHEMA IF NOT EXISTS matching_service
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: matching_service
  flyway:
    enabled: false

jwt:
  secret: test-secret-at-least-32-chars-long-000
  expiration-minutes: 120
