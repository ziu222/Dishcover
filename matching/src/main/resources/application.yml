server:
  port: 8084

spring:
  application:
    name: matching
  datasource:
    # ",public" bắt buộc: pgvector's CREATE EXTENSION đặt type "vector" VÀ operator "<=>" vào
    # schema public (mặc định) - currentSchema chỉ 1 schema riêng sẽ set search_path đúng mỗi
    # matching_service, làm cả 2 thứ đó "vô hình" với runtime connection dù bảng vẫn tạo được (lúc
    # Flyway baseline chạy qua phiên psql khác, search_path mặc định có public) - bug thật tìm được
    # lúc live-verify Giai đoạn B (RecipeEmbeddingRepository).
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:larder}?currentSchema=matching_service,public
    username: ${POSTGRES_USER:larder_app}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: matching_service
  flyway:
    schemas: matching_service
    default-schema: matching_service
    baseline-on-migrate: true
    baseline-version: "1"

# Địa chỉ 3 service gọi ra (không Eureka — Docker DNS/localhost, cùng quy ước với Gateway).
services:
  inventory-url: ${INVENTORY_SERVICE_URL:http://localhost:8082}
  recipe-url: ${RECIPE_SERVICE_URL:http://localhost:8083}
  user-url: ${USER_SERVICE_URL:http://localhost:8081}

# JWT: CÙNG secret với User/Inventory/Recipe qua env JWT_SECRET.
jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}

# Circuit breaker cho 3 client gọi Inventory/Recipe/User (CLAUDE.md mục 4.1 pattern, mục 3.5 review).
resilience4j:
  circuitbreaker:
    instances:
      inventory-service:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
      recipe-service:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
      user-service:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
