server:
  port: 8083

spring:
  application:
    name: recipe
  data:
    web:
      pageable:
        # Chặn size quá lớn (VD ?size=100000) — tránh tải toàn bộ collection gây quá tải.
        max-page-size: 100
        default-page-size: 20
    mongodb:
      # Tách từng property thay vì nhét chung 1 URI cho dễ đọc/đổi từng phần.
      # Mật khẩu KHÔNG có giá trị mặc định: thiếu MONGO_ROOT_PASSWORD thì service không khởi động
      # được, thay vì âm thầm chạy bằng mật khẩu mặc định ai cũng đoán ra.
      host: ${MONGO_HOST:localhost}
      port: ${MONGO_PORT:27017}
      database: ${MONGO_DB:recipe_matcher_db}
      username: ${MONGO_ROOT_USER:larder_app}
      password: ${MONGO_ROOT_PASSWORD}
      authentication-database: admin

# JWT: chỉ cần cho endpoint ghi (POST/PATCH/DELETE) — đọc công thức là FREE, không cần token
# (specs/recipe-service.md mục 1). Cùng secret với User/Inventory qua env JWT_SECRET.
jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}

# Giai đoạn B (vector search, CLAUDE.md mục 6) — Recipe Service gọi ra RAG (embed) + Matching (lưu
# vector) sau khi tạo/sửa công thức, chạy nền (RecipeIndexer, @Async) — không Eureka, cùng quy ước
# localhost/Docker DNS với Gateway.
services:
  rag-url: ${RAG_SERVICE_URL:http://localhost:8085}
  matching-url: ${MATCHING_SERVICE_URL:http://localhost:8084}

resilience4j:
  circuitbreaker:
    instances:
      rag-service:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
      matching-service:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s

# Upload ảnh công thức (khu quản trị). Bucket riêng tư, người dùng đọc qua CloudFront cùng
# distribution với frontend nên ảnh cùng origin với trang — xem infra/aws/recipe-images.tf.
# KHÔNG có access key ở đây: trên ECS xác thực bằng IAM task role, trên máy dev bằng profile AWS.
app:
  recipe-images:
    bucket: ${RECIPE_IMAGES_BUCKET:}
    public-base-url: ${RECIPE_IMAGES_BASE_URL:}
    # Máy dev ghi chung bucket thật nhưng tách prefix, đúng đánh đổi đã chốt ở CLAUDE.md mục 3
    # (không dựng LocalStack/MinIO cho vài tấm ảnh do admin đăng).
    key-prefix: ${RECIPE_IMAGES_KEY_PREFIX:}

spring.servlet.multipart:
  max-file-size: 5MB
  max-request-size: 6MB
