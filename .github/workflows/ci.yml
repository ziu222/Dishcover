name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      # Chỉ Recipe Service cần Mongo thật cho test (không có H2-equivalent cho Mongo) — xem
      # recipe/src/test/resources/application-test.yml. Các module khác dùng H2, không cần service.
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        env:
          MONGO_INITDB_ROOT_USERNAME: larder_app
          MONGO_INITDB_ROOT_PASSWORD: changeme
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")' -u larder_app -p changeme --authenticationDatabase admin"
          --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: mvn test (toàn bộ 10 module)
        env:
          MONGO_ROOT_USER: larder_app
          MONGO_ROOT_PASSWORD: changeme
        run: ./mvnw -B test

      - name: Publish test summary
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Maven tests
          path: "**/target/surefire-reports/*.xml"
          reporter: java-junit
          fail-on-error: false

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Type-check + build (không có test suite frontend, xem docs/notification-test-report.md mục 4)
        run: npm run build
        working-directory: frontend
